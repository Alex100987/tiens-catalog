<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="TIENS Каталог 2.0 — демо интерактивного каталога продукции">
<meta property="og:title" content="TIENS Каталог 2.0">
<meta property="og:description" content="Продукция TIENS: состав, приём и регистрация в V-Moment с вашим наставником">
<meta name="theme-color" content="#12843f">
<title>TIENS Каталог 2.0</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: the catalog behaves like a phone app — one centered column, sticky top bar, bottom tab bar; on desktop the column floats on a soft field. */
:root{
  --bg:#f3f6f2; --surface:#ffffff; --tray:#eaf0e9; --ink:#14211a; --muted:#5d6b62; --line:#dbe3db;
  --green:#12843f; --green-ink:#ffffff; --green-soft:#e1f2e6; --deep:#0f2a1d;
  --warn:#a35a00; --warn-soft:#fbefdc; --bad:#b3261e; --bad-soft:#fbe4e2;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c130f; --surface:#141d17; --tray:#e4ebe4; --ink:#e7eee8; --muted:#9aa89e; --line:#26332a;
  --green:#3cc472; --green-ink:#06160c; --green-soft:#183323; --deep:#cfe9d8;
  --warn:#f0b357; --warn-soft:#33270f; --bad:#ff8a80; --bad-soft:#3a1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c130f; --surface:#141d17; --tray:#e4ebe4; --ink:#e7eee8; --muted:#9aa89e; --line:#26332a;
  --green:#3cc472; --green-ink:#06160c; --green-soft:#183323; --deep:#cfe9d8;
  --warn:#f0b357; --warn-soft:#33270f; --bad:#ff8a80; --bad-soft:#3a1714; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;margin:0}
.app{max-width:560px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.wrap{padding-inline:16px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding:12px 16px}
.brand{display:flex;align-items:baseline;gap:8px;flex:1;min-width:0}
.brand b{font-family:var(--f-display);font-size:17px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted);white-space:nowrap}
.back{border:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;width:36px;height:36px;display:grid;place-items:center}
.demo-tag{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:99px}

/* mentor strip */
.mentor{margin:14px 16px 0;border-radius:var(--r);padding:14px;display:flex;gap:12px;align-items:center}
.mentor.on{background:var(--deep);color:var(--bg)}
.mentor.off{background:var(--warn-soft);color:var(--ink);border:1px dashed var(--warn)}
.mentor .av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:15px;flex:none}
.mentor.on .av{background:var(--green);color:var(--green-ink)}
.mentor.off .av{background:var(--surface);color:var(--warn)}
.mentor .t{flex:1;min-width:0}
.mentor .t small{display:block;font-size:11px;opacity:.75;text-transform:uppercase;letter-spacing:.08em}
.mentor .t strong{display:block;font-size:15px}
.mentor .t .mono{font-size:13px;opacity:.85}
.mentor button.mini{border:0;border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;background:color-mix(in srgb,currentColor 14%,transparent);color:inherit}
.mentor-form{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.mentor-form input{flex:1;min-width:150px}

/* inputs/buttons */
input[type=text],input[type=search],input[type=tel]{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn.primary{background:var(--green);color:var(--green-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.block{width:100%}
.btn[aria-disabled="true"]{opacity:.55}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1;min-width:140px}

/* home */
.hero{padding:22px 16px 6px}
.hero h1{font-size:26px;line-height:1.15}
.hero p{color:var(--muted);margin:8px 0 0;max-width:42ch}
.search{padding:14px 16px 0}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.group{padding:22px 16px 0}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.group-h h2{font-size:15px}
.group-h span{font-size:12px;color:var(--muted)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0;text-align:left;display:flex;flex-direction:column;overflow:hidden}
.card .shot{background:var(--tray);aspect-ratio:1/1;display:grid;place-items:center;padding:14px}
.card .shot img{max-height:100%;max-width:100%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(20,33,26,.14))}
.card .body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.card .name{font-weight:600;font-size:14px;line-height:1.3}
.card .meta{font-size:12px;color:var(--muted)}
.card .code{font-size:11px;color:var(--muted)}
.soon{display:grid;gap:8px}
.soon div{display:flex;justify-content:space-between;align-items:center;background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;color:var(--muted);font-size:14px}
.empty{padding:24px 16px;color:var(--muted)}

/* product */
.p-hero{margin:14px 16px 0;background:var(--tray);border-radius:20px;display:grid;place-items:center;padding:22px;position:relative}
.p-hero img{height:230px;max-width:100%;object-fit:contain;filter:drop-shadow(0 12px 18px rgba(20,33,26,.18))}
.crumbs{font-size:12px;color:var(--muted);padding:12px 16px 0}
.p-title{padding:6px 16px 0}
.p-title h1{font-size:21px;line-height:1.2}
.p-title .mono{font-size:12px;color:var(--muted);display:block;margin-top:6px}
.modes{margin:16px 16px 0;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.modes button{border:0;background:transparent;border-radius:9px;padding:9px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.modes button[aria-selected="true"]{background:var(--ink);color:var(--bg)}
.sec{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.sec h3{font-size:14px;margin-bottom:8px}
.sec p{margin:0}
.sec ul{margin:0;padding-left:18px}
.sec li+li{margin-top:4px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.disc{margin:14px 16px 0;font-size:12px;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:12px}
.flag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.cta{margin:14px 16px 0;display:grid;gap:10px}

.yesno{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yesno>div{border-radius:12px;padding:12px;font-size:13px;min-width:0}
.yes{background:var(--green-soft)}
.no{background:var(--bad-soft)}
.yesno b{display:block;font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.yes b{color:var(--green)} .no b{color:var(--bad)}
.yesno ul{padding-left:16px}
.no li{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--bad) 60%,transparent)}
.post{white-space:pre-wrap;background:var(--bg);border-radius:12px;padding:12px;font-size:14px;border:1px solid var(--line)}
.script{border-left:3px solid var(--green);padding-left:12px;font-size:14px}
.q{margin-top:12px}
.q p{font-weight:600;font-size:14px;margin-bottom:6px}
.opts{display:grid;gap:6px}
.opts button{text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:14px}
.opts button.right{border-color:var(--green);background:var(--green-soft)}
.opts button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.score{margin-top:12px;font-weight:600}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.funnel{display:grid;gap:8px;margin-top:4px}
.fn{display:grid;grid-template-columns:120px 1fr 42px;gap:10px;align-items:center;font-size:13px}
.fn i{display:block;height:10px;border-radius:99px;background:var(--green)}
.fn .track{background:var(--bg);border-radius:99px}
.fn em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.ok{background:var(--green-soft);color:var(--green)}

/* join */
.steps{display:grid;gap:10px;margin:14px 16px 0;padding:0;list-style:none;counter-reset:s}
.steps li{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 14px 52px;position:relative;counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:14px;top:14px;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-size:12px}
.steps b{display:block;margin-bottom:4px}
.steps p{margin:0;font-size:14px;color:var(--muted)}
.codebox{display:flex;align-items:center;gap:10px;background:var(--deep);color:var(--bg);border-radius:var(--r);padding:14px 16px;margin:14px 16px 0}
.codebox .mono{font-size:24px;flex:1;letter-spacing:.08em}
.codebox small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.codebox button{border:0;border-radius:10px;padding:10px 12px;font-weight:600;background:var(--green);color:var(--green-ink)}

/* mylink */
.out{margin:14px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.linkline{font-family:var(--f-mono);font-size:12px;background:var(--bg);border-radius:10px;padding:10px 12px;word-break:break-all;border:1px solid var(--line)}
.qr{background:#fff;border-radius:12px;padding:12px;width:200px;max-width:100%;justify-self:center}
.qr svg{display:block;width:100%;height:auto}
.err{color:var(--bad);font-size:13px}
.field{display:grid;gap:6px;margin:14px 16px 0}
.field label{font-size:13px;font-weight:600}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tabs button{border:0;background:transparent;padding:10px 4px 12px;display:grid;justify-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--green)}
.tabs svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:9}
@media (prefers-reduced-motion:no-preference){.view{animation:in .22s ease-out}@keyframes in{from{transform:translateY(6px)}to{transform:none}}}
@media (min-width:600px){.app{border-inline:1px solid var(--line)}}
</style>

</head>

<div class="app">
  <header class="top"><div class="top-in">
    <button class="back" id="backBtn" hidden aria-label="Назад"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="brand"><b>TIENS</b><span>Каталог 2.0</span></div>

  <main id="view"></main>
</div>

<nav class="tabs" aria-label="Разделы"><div class="tabs-in">

</div></nav>

const store = { get(k){try{return localStorage.getItem(k)}catch(e){return null}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}, del(k){try{localStorage.removeItem(k)}catch(e){}} };
const validCode = c => /^\d{6,10}$/.test(c||"");
function hexEnc(s){return Array.from(new TextEncoder().encode(s)).map(b=>b.toString(16).padStart(2,"0")).join("")}
function hexDec(h){try{const b=new Uint8Array(h.match(/../g).map(x=>parseInt(x,16)));return new TextDecoder().decode(b)}catch(e){return ""}}

let mentor = null; // {code,name}
function readRef(){
  let code=null,name="";
  const h=(location.hash||"").replace(/^#/,"");
  const m=h.match(/^ref-(\d{6,10})(?:-n-([0-9a-f]+))?$/i);
  if(m){code=m[1]; if(m[2]) name=hexDec(m[2]);}
  if(!code){ try{ const q=new URLSearchParams(location.search); if(validCode(q.get("ref"))){code=q.get("ref"); name=q.get("name")||"";} }catch(e){} }
  if(code){ mentor={code,name}; store.set("tiens_mentor",JSON.stringify(mentor)); return; }
  try{ const s=JSON.parse(store.get("tiens_mentor")||"null"); if(s&&validCode(s.code)) mentor=s; }catch(e){}
}
readRef();

function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,1800)}
async function copy(text, okMsg){
  try{ await navigator.clipboard.writeText(text); toast(okMsg||"Скопировано"); }
  catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast(okMsg||"Скопировано")}catch(_){toast("Выделите текст и скопируйте вручную")} ta.remove(); }
}
function initials(n){return (n||"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0].toUpperCase()).join("")||"ID"}
function baseUrl(){return BASE_URL.startsWith("http") ? BASE_URL : location.href.split("#")[0].split("?")[0]}
function personalLink(code,name){ if(LINK_MODE==="query") return baseUrl()+"?ref="+code+(name?"&name="+encodeURIComponent(name.trim()):""); return baseUrl()+"#ref-"+code+(name?"-n-"+hexEnc(name.trim()):"")}

function go(view, extra={}){ state.stack.push({view:state.view,pid:state.pid}); Object.assign(state,{view},extra); render(); window.scrollTo(0,0); }
function back(){ const p=state.stack.pop(); if(p){Object.assign(state,p); render(); window.scrollTo(0,0);} }

  const done=Object.keys(st).length, right=Object.entries(st).filter(([i,a])=>p.quiz[i].a===a).length;
  return `<section class="sec"><h3>Мини-тест: проверь себя</h3>${qs}
    ${done===p.quiz.length?`<p class="score">${right} из ${p.quiz.length} верно${right===p.quiz.length?" — можно рассказывать клиентам":". Перечитайте блок «можно / нельзя»"}</p><button class="btn ghost" data-act="quiz-reset" data-pid="${p.id}">Пройти ещё раз</button>`:""}</section>`;
}

function vJoin(){
  return `${mentorHTML()}
  <section class="hero"><h1>Регистрация в TIENS</h1><p>Регистрация ID дистрибьютора проходит через приложение V-Moment. Ваш наставник закрепляется по его коду приглашения.</p></section>
  ${mentor?`<div class="codebox"><div style="flex:1;min-width:0"><small>Код наставника</small><span class="mono">${esc(mentor.code)}</span></div><button data-act="copy-code">Скопировать</button></div>`:""}
  <ol class="steps">
    <li><b>Откройте ссылку и создайте аккаунт</b><p>Выберите регистрацию по электронной почте: SMS в России могут не приходить. Письмо с кодом может попасть в «Спам».</p></li>
    <li><b>Проверьте поле «Пригласивший»</b><p>${mentor?`Там должен стоять код ${esc(mentor.code)}. Если поле пустое — вставьте скопированный код.`:"Вставьте код человека, который вас пригласил."}</p></li>
    <li><b>Оформите ID дистрибьютора</b><p>Профиль → «Связать номер реселлера» → «Присоединяйтесь к нам». В полях «Наставник» и «Позиционный спонсор» укажите тот же код и нажмите «Проверить» — появится имя наставника.</p></li>
    <li><b>Активируйте ID</b><p>Первая покупка от 100 PV открывает дистрибьюторские цены. Регистрация — с 18 лет.</p></li>
  </ol>
  <div class="cta">${regButton("Открыть регистрацию в V-Moment")}</div>
  <section class="sec"><h3>Хотите просто купить?</h3><p style="font-size:14px;color:var(--muted)">Без ID дистрибьютора можно покупать в розничном магазине «Семейный» внутри V-Moment. Позже ID покупателя можно переоформить в ID дистрибьютора с сохранением накопленного товарооборота.</p></section>
  <p class="note wrap" style="margin-top:12px">Порядок регистрации — по инструкциям дистрибьюторов на октябрь 2026. Перед запуском сверить с ООО «Тяньши».</p>`;
}

function vMyLink(){
  const code=state.myCode??(mentor&&state.myFromMentor?mentor.code:"");
  return `<section class="hero"><h1>Моя ссылка на каталог</h1><p>Каждый партнёр раздаёт свою ссылку. Кто откроет каталог по ней, зарегистрируется именно под этого партнёра.</p></section>
  <form data-form="mylink">
    <div class="field"><label for="myCode">Ваш VM ID (код приглашения)</label><input type="tel" inputmode="numeric" id="myCode" placeholder="8 цифр, напр. 99630071" value="${esc(state.myCode||"")}">
      <span class="note" style="margin:0">VM ID — в профиле V-Moment под вашим именем.</span></div>
    <div class="field"><label for="myName">Имя для клиентов</label><input type="text" id="myName" placeholder="Например, Алексей Корнилов" value="${esc(state.myName||"")}"></div>
    <div class="wrap" style="margin-top:14px"><button class="btn primary block" type="submit">Создать ссылку</button></div>
  </form>
  <div id="linkOut">${state.linkErr?`<p class="err wrap" style="margin-top:10px">${esc(state.linkErr)}</p>`:""}${state.myLink?linkOutHTML():""}</div>
  <section class="sec"><h3>Как это защищает структуру</h3><ul style="font-size:14px">
    <li>В каталоге нет общего кода по умолчанию: без ссылки партнёра регистрация не начнётся.</li>
    <li>Код из ссылки подставляется во все кнопки регистрации и покупки.</li>
    <li>V-Moment при проверке показывает имя наставника, и новичок видит, к кому встаёт.</li>
    <li>После регистрации новичок создаёт здесь свою ссылку — цепочка наставничества сохраняется.</li></ul></section>`;
}
function linkOutHTML(){
  return `<div class="out"><span class="label">Ваша ссылка на каталог</span><div class="linkline" id="myLinkText">${esc(state.myLink)}</div>
    <div class="row"><button class="btn primary" data-act="copy-link">Скопировать</button><button class="btn ghost" data-act="preview-link">Открыть как клиент</button></div>
    <div class="qr" id="qr" aria-label="QR-код ссылки"></div>
    <span class="label">Прямая ссылка на регистрацию в V-Moment</span><div class="linkline">${esc(VM_REG(state.myCode))}</div>
    <button class="btn ghost" data-act="copy-reg">Скопировать ссылку регистрации</button></div>`;
}
function drawQR(){
  const box=$("#qr"); if(!box||!state.myLink) return;
  if(typeof qrcode!=="function"){ box.innerHTML='<p class="note" style="color:#333">QR-код не загрузился. Ссылку можно скопировать выше.</p>'; return; }
  const qr=qrcode(0,"M"); qr.addData(state.myLink); qr.make(); box.innerHTML=qr.createSvgTag({cellSize:4,margin:0,scalable:true});
}

/* ---------- render & events ---------- */
function render(){
  const v=state.view;
  $("#view").innerHTML=`<div class="view">${v==="home"?vHome():v==="product"?vProduct():v==="join"?vJoin():vMyLink()}</div>`;
  $("#backBtn").hidden = v!=="product";
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-current", (b.dataset.tab===v || (v==="product"&&b.dataset.tab==="home"))?"page":"false"));
  if(v==="mylink") drawQR();
}
document.addEventListener("click",e=>{
  const t=e.target.closest("button,a"); if(!t) return;
  const d=t.dataset;
  if(d.tab){ state.stack=[]; state.view=d.tab; render(); window.scrollTo(0,0); return; }
  if(t.id==="backBtn"){ back(); return; }
  if(d.open){ go("product",{pid:d.open,mode:state.view==="product"?state.mode:"client"}); return; }
  if(d.go){ go(d.go); return; }
  if(d.topic){ state.topic=d.topic; render(); return; }
  if(d.mode){ state.mode=d.mode; render(); return; }
  if(d.quiz){ const st=state.quiz[d.quiz]=state.quiz[d.quiz]||{}; st[+d.qi]=+d.oi; const y=window.scrollY; render(); window.scrollTo(0,y); return; }
  const a=d.act; if(!a) return;
  const p=P.find(x=>x.id===state.pid);
  if(a==="need-mentor"){ e.preventDefault(); toast("Сначала укажите код наставника"); const i=$("#mentorCode"); if(i){i.focus();i.scrollIntoView({block:"center"})} else {state.view="home";render();setTimeout(()=>{const j=$("#mentorCode");j&&j.focus()},50)} }
  if(a==="mentor-change"){ mentor=null; store.del("tiens_mentor"); render(); setTimeout(()=>{const j=$("#mentorCode");j&&j.focus()},50); }
  if(a==="copy-post") copy(p.post+(mentor?"\n"+personalLink(mentor.code,mentor.name):""),"Пост скопирован");
  if(a==="copy-mylink") copy(personalLink(mentor.code,mentor.name),"Ссылка скопирована");
  if(a==="copy-code") copy(mentor.code,"Код скопирован");
  if(a==="copy-link") copy(state.myLink,"Ссылка скопирована");
  if(a==="copy-reg") copy(VM_REG(state.myCode),"Ссылка скопирована");
  if(a==="preview-link"){ mentor={code:state.myCode,name:state.myName||""}; store.set("tiens_mentor",JSON.stringify(mentor)); state.stack=[]; state.view="home"; render(); window.scrollTo(0,0); toast("Так каталог увидит ваш клиент"); }
  if(a==="quiz-reset"){ state.quiz[d.pid]={}; render(); }
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  const f=e.target.dataset.form;
  if(f==="mentor"){ const c=$("#mentorCode").value.replace(/\D/g,""); if(!validCode(c)){toast("Код — от 6 до 10 цифр");return} mentor={code:c,name:""}; store.set("tiens_mentor",JSON.stringify(mentor)); render(); toast("Наставник указан"); }
  if(f==="mylink"){ const c=$("#myCode").value.replace(/\D/g,""), n=$("#myName").value.trim(); state.myCode=c; state.myName=n;
    if(!validCode(c)){ state.linkErr="Введите VM ID: от 6 до 10 цифр, без пробелов."; state.myLink=""; }
    else { state.linkErr=""; state.myLink=personalLink(c,n); }
    render(); const o=$("#linkOut"); o&&o.scrollIntoView({behavior:"smooth",block:"start"}); }
});
document.addEventListener("input",e=>{ if(e.target.id==="q"){ state.q=e.target.value; const pos=e.target.selectionStart; render(); const q=$("#q"); q.focus(); q.setSelectionRange(pos,pos);} });
window.addEventListener("hashchange",()=>{readRef();render()});
render();
</script>

</body>
</html>
